[package]
name = "endpoint-lab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP execution, benchmarking, and local persistence for Endpoint Lab"

[dependencies]
directories = "6"
hdrhistogram = "7"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
